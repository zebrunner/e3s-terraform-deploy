version: 0.2

phases:
  install:
    commands:
      - echo Installing Terraform…
      - sudo yum install -y yum-utils
      - sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - sudo yum -y install terraform
      - terraform version
  pre_build:
    commands:
      - echo Fetching config from Secrets Manager…
      - cd deploy
      - aws secretsmanager get-secret-value --secret-id ${config_s3_tfbackend_secret_id} --query SecretString --output text > config.s3.tfbackend
      - aws secretsmanager get-secret-value --secret-id ${terraform_tfvars_secret_id} --query SecretString --output text > terraform.tfvars
  build:
    commands:
      - echo Initializing Terraform…
      - terraform init -backend-config="config.s3.tfbackend"
      - echo Applying…
      - terraform apply -auto-approve -var-file="terraform.tfvars"
    on-failure: CONTINUE
  post_build:
    commands:
      - |
        echo "=== POST BUILD CHECK ==="
        
        echo "Reading SNS topic ARNs from Secrets Manager…"
        SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$${SNS_SECRET_ID}" --query SecretString --output text)
        SUCCESS_SNS_TOPIC_ARN=$(echo "$${SECRET_JSON}" | jq -r '.SUCCESS_SNS_TOPIC_ARN')
        FAILURE_SNS_TOPIC_ARN=$(echo "$${SECRET_JSON}" | jq -r '.FAILURE_SNS_TOPIC_ARN')

        echo "Reading AMI information from Terraform outputs…"
        if [ -f "ami_info.txt" ]; then
          AMI_JSON=$(cat ami_info.txt)
          ESG_SERVER_AMI_ID=$(echo "$${AMI_JSON}" | jq -r '.esg_server_ami_id')
          ESG_SERVER_AMI_NAME=$(echo "$${AMI_JSON}" | jq -r '.esg_server_ami_name')
          ESG_SERVER_AMI_DATE=$(echo "$${AMI_JSON}" | jq -r '.esg_server_ami_date')
          ESG_WORKER_NODE_AMI_ID=$(echo "$${AMI_JSON}" | jq -r '.esg_worker_node_ami_id')
          ESG_WORKER_NODE_AMI_NAME=$(echo "$${AMI_JSON}" | jq -r '.esg_worker_node_ami_name')
          ESG_WORKER_NODE_AMI_DATE=$(echo "$${AMI_JSON}" | jq -r '.esg_worker_node_ami_date')
        else
          ESG_SERVER_AMI_ID="N/A"
          ESG_SERVER_AMI_NAME="N/A"
          ESG_SERVER_AMI_DATE="N/A"
          ESG_WORKER_NODE_AMI_ID="N/A"
          ESG_WORKER_NODE_AMI_NAME="N/A"
          ESG_WORKER_NODE_AMI_DATE="N/A"
        fi
        
        echo "Formatting AMI names and dates for display…"
        ESG_SERVER_AMI_DISPLAY_NAME=$(echo "$${ESG_SERVER_AMI_NAME}" | sed 's/ubuntu\/images\/hvm-ssd\///')
        ESG_WORKER_NODE_AMI_DISPLAY_NAME=$(echo "$${ESG_WORKER_NODE_AMI_NAME}" | sed 's/Z-.*/Z/')
        ESG_SERVER_AMI_DISPLAY_DATE=$(date -d "$${ESG_SERVER_AMI_DATE}" "+%Y-%m-%d %H:%M:%S UTC" 2>/dev/null || echo "$${ESG_SERVER_AMI_DATE}")
        ESG_WORKER_NODE_AMI_DISPLAY_DATE=$(date -d "$${ESG_WORKER_NODE_AMI_DATE}" "+%Y-%m-%d %H:%M:%S UTC" 2>/dev/null || echo "$${ESG_WORKER_NODE_AMI_DATE}")

        if [ "$${CODEBUILD_BUILD_SUCCEEDING}" -eq 1 ]; then
          echo "Hi there," >> message.txt
          echo "" >> message.txt
          echo "The QA ESG environment has been successfully updated to the latest AMIs." >> message.txt
          echo "" >> message.txt
          echo "ESG Server:" >> message.txt
          echo "  AMI ID: $${ESG_SERVER_AMI_ID}" >> message.txt
          echo "  Name: $${ESG_SERVER_AMI_DISPLAY_NAME}" >> message.txt
          echo "  Created: $${ESG_SERVER_AMI_DISPLAY_DATE}" >> message.txt
          echo "" >> message.txt
          echo "ESG Worker Nodes:" >> message.txt
          echo "  AMI ID: $${ESG_WORKER_NODE_AMI_ID}" >> message.txt
          echo "  Name: $${ESG_WORKER_NODE_AMI_DISPLAY_NAME}" >> message.txt
          echo "  Created: $${ESG_WORKER_NODE_AMI_DISPLAY_DATE}" >> message.txt
          echo "" >> message.txt
          echo "If you notice anything unusual, please let us know." >> message.txt
          echo "" >> message.txt
          echo "Best regards," >> message.txt
          echo "ESG Update Bot" >> message.txt
          
          aws sns publish \
            --topic-arn "$SUCCESS_SNS_TOPIC_ARN" \
            --subject "QA ESG – Successful AMI Update" \
            --message file://message.txt
        else
          CURRENT_UTC_TIME=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
          PROJECT_NAME="$${CODEBUILD_BUILD_ID%%:*}"
          BUILD_NUM="$${CODEBUILD_BUILD_NUMBER}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="$${AWS_REGION}"
          LOG_URL="https://$${REGION}.console.aws.amazon.com/codesuite/codebuild/$${ACCOUNT_ID}/projects/$${PROJECT_NAME}/build/$${CODEBUILD_BUILD_ID}/?region=$${REGION}"
          
          echo "Hi there," >> message.txt
          echo "" >> message.txt
          echo "The QA ESG environment update has failed." >> message.txt
          echo "" >> message.txt
          echo "Attempted AMI Updates:" >> message.txt
          echo "" >> message.txt
          echo "ESG Server:" >> message.txt
          echo "  AMI ID: $${ESG_SERVER_AMI_ID}" >> message.txt
          echo "  Name: $${ESG_SERVER_AMI_DISPLAY_NAME}" >> message.txt
          echo "  Created: $${ESG_SERVER_AMI_DISPLAY_DATE}" >> message.txt
          echo "" >> message.txt
          echo "ESG Worker Nodes:" >> message.txt
          echo "  AMI ID: $${ESG_WORKER_NODE_AMI_ID}" >> message.txt
          echo "  Name: $${ESG_WORKER_NODE_AMI_DISPLAY_NAME}" >> message.txt
          echo "  Created: $${ESG_WORKER_NODE_AMI_DISPLAY_DATE}" >> message.txt
          echo "" >> message.txt
          echo "Build Information:" >> message.txt
          echo "- Project: $${PROJECT_NAME}" >> message.txt
          echo "- Build Number: $${BUILD_NUM}" >> message.txt
          echo "- Time: $${CURRENT_UTC_TIME}" >> message.txt
          echo "- Logs: $${LOG_URL}" >> message.txt
          echo "" >> message.txt
          echo "Please check the logs for more details." >> message.txt
          echo "" >> message.txt
          echo "Best regards," >> message.txt
          echo "ESG Update Bot" >> message.txt
          
          aws sns publish \
            --topic-arn "$FAILURE_SNS_TOPIC_ARN" \
            --subject "QA ESG – AMI Update Failed" \
            --message file://message.txt
        fi
artifacts:
  files:
    - "**/*"
  discard-paths: yes
